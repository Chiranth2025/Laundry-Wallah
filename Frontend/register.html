<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Laundry Wallah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="logo.jpg" alt="Laundry Wallah Logo" class="logo-img">
            </a>
        </div>
        <div class="hamburger" id="hamburger">☰</div>
        <nav id="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">My Orders</a>
            <a href="login.html" class="nav-btn">Login</a>
        </nav>
    </header>

    <main class="login-section">
        <div class="login-container">
            <h2>Create an Account</h2>
            <p>Join Laundry Wallah today.</p>

            <form id="registerForm">
                <div class="input-group">
                    <label for="reg-username">Full Name</label>
                    <input type="text" id="reg-username" placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="cta-button" style="width: 100%; border: none; cursor: pointer;">Sign Up</button>
                
                <div class="signup-link">
                    <p>Already have an account? <a href="login.html">Log in here</a></p>
                </div>
            </form>
        </div>
    </main>
    
   <script src="js/app.js "></script>
</body>
</html>
